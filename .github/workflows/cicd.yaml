name: CICD

on:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write
  contents: write

jobs:
  spotless_check:
    name: Spotless Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck

  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: spotless_check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Android APK (Release)
        run: ./gradlew :androidApp:assembleRelease

      - name: Rename APK
        run: mv androidApp/build/outputs/apk/release/androidApp-release.apk androidApp/build/outputs/apk/release/kocoboy-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/release/kocoboy-android.apk
          if-no-files-found: error

  build_wasm:
    name: Build Wasm
    runs-on: ubuntu-latest
    needs: spotless_check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Wasm
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Zip Wasm
        working-directory: webApp/build/dist/wasmJs/productionExecutable
        run: zip -r kocoboy-wasm.zip .

      - name: Upload Wasm Zip Artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-build
          path: webApp/build/dist/wasmJs/productionExecutable/kocoboy-wasm.zip
          if-no-files-found: error

      - name: Upload pages artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: webApp/build/dist/wasmJs/productionExecutable/

  deploy_wasm:
    name: Deploy Wasm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_wasm
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build_desktop:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            ext: msi
          - os: macos-latest
            name: macos
            ext: dmg
          - os: ubuntu-latest
            name: linux
            ext: deb
    runs-on: ${{ matrix.os }}
    needs: spotless_check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build Desktop Package
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS
        shell: bash

      - name: Rename Desktop Package
        shell: bash
        run: |
          dir=desktopApp/build/compose/binaries/main/${{ matrix.ext }}
          for file in "$dir"/kocoboy*.${{ matrix.ext }}; do
            mv "$file" "$dir/kocoboy-${{ matrix.name }}${file#"$dir"/kocoboy}"
          done

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kocoboy-${{ matrix.name }}
          path: desktopApp/build/compose/binaries/main/${{ matrix.ext }}/kocoboy-${{ matrix.name }}*.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ build_android, build_wasm, build_desktop ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          range=latest..HEAD
          git rev-parse -q --verify refs/tags/latest > /dev/null || range="-1 HEAD"
          { echo "## Commits"; git log --format='- %h: %s (%an)' $range; } > notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --prerelease --title "Latest Release" --target "$GITHUB_SHA" --notes-file notes.md \
            android-apk/kocoboy-android.apk \
            wasm-build/kocoboy-wasm.zip \
            kocoboy-windows/* \
            kocoboy-macos/* \
            kocoboy-linux/*
